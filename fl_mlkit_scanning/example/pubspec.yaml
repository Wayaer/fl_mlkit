name: example
description: Demonstrates how to use the fl_mlkit_scanning plugin.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  fl_mlkit_scanning:
    path: ../
  fl_extended: ^5.0.0
  fl_list_wheel: ^1.0.0
  file_picker: ^13.3.0

dev_dependencies:
  flutter_lints: ^6.0.0

dependency_overrides:
  fl_camera:
    path: ../../fl_camera

flutter:
  uses-material-design: true
