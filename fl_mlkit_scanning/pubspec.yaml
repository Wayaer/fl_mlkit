name: fl_mlkit_scanning
description: Google ML Kit barcode scanning plugin, supports Android and iOS.
version: 6.0.0
homepage: https://github.com/Wayaer/fl_mlkit/tree/main/fl_mlkit_scanning
repository: https://github.com/Wayaer/fl_mlkit/tree/main/fl_mlkit_scanning
issue_tracker: https://github.com/Wayaer/fl_mlkit/issues
topics:
  - mlkit
  - barcode
  - qrcode
  - scanner
  - flutter

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  fl_camera: ^5.0.0
  fl_channel: ^2.0.0

dev_dependencies:
  flutter_lints: '>=5.0.0 <7.0.0'

flutter:
  plugin:
    platforms:
      android:
        package: fl.mlkit.scanning
        pluginClass: FlMlKitScanningPlugin
      ios:
        pluginClass: FlMlKitScanningPlugin
