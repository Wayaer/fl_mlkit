name: fl_mlkit_identify_language
description: Identify the language of text with Google ML Kit, supports Android and iOS.
version: 2.0.0
homepage: https://github.com/Wayaer/fl_mlkit/tree/main/fl_mlkit_identify_language
repository: https://github.com/Wayaer/fl_mlkit/tree/main/fl_mlkit_identify_language
issue_tracker: https://github.com/Wayaer/fl_mlkit/issues
topics:
  - mlkit
  - language
  - language-identification
  - flutter

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: '>=5.0.0 <7.0.0'

flutter:
  plugin:
    platforms:
      android:
        package: fl.mlkit.identify.language
        pluginClass: FlMlKitIdentifyLanguagePlugin
      ios:
        pluginClass: FlMlKitIdentifyLanguagePlugin
